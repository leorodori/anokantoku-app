<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あの頃の監督</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    
    <!-- ヘッダー -->
    <header class="chat-header">
      <div class="avatar">⚾</div>
      <div class="header-info">
        <h2>鬼塚監督</h2>
        <span class="status">オンライン（熱血指導中）</span>
      </div>
    </header>

    <!-- メッセージ表示エリア -->
    <main class="chat-messages" id="chatMessages">
      <div class="message kantoku">
        <div class="bubble">おい！なにか言いたいことがあるならハッキリ言ってみろ！</div>
      </div>
    </main>

    <!-- 入力エリア -->
    <footer class="chat-input-area">
      <input type="text" id="userInput" placeholder="監督にメッセージを送信..." autocomplete="off">
      <button id="sendBtn">送信</button>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
